name: Publish preview release

on:
  push:
    branches: [main]
    paths:
      - 'downloads/FramegenDllTester.exe'
      - 'docs/RELEASE-0.3.7.md'
      - '.github/workflows/release.yml'
      - 'tools/Publish-Release.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify packages and publish v0.3.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/Publish-Release.py --version 0.3.7
